<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 3D desde Cero</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0b1a; }
        canvas { display: block; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Escena, Cámara y Renderizador
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        camera.position.set(0, 3, 6);

        // 2. Iluminación
        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(5, 10, 7);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2));

        // 3. CONSTRUIR EL "MÓDULO LUNAR" DESDE CERO CON FIGURAS BÁSICAS
        const lunarModule = new THREE.Group();

        // Materiales (simulando dorado y metal)
        const goldMaterial = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.3 });
        const silverMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 });
        const legMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });

        // Etapa de descenso (Cuerpo octagonal o cilíndrico)
        const baseGeom = new THREE.CylinderGeometry(1.2, 1.5, 1, 6);
        const baseMesh = new THREE.Mesh(baseGeom, goldMaterial);
        lunarModule.add(baseMesh);

        // Etapa de ascenso (Cabina superior)
        const cabinGeom = new THREE.BoxGeometry(1.2, 0.8, 1.2);
        const cabinMesh = new THREE.Mesh(cabinGeom, silverMaterial);
        cabinMesh.position.y = 0.9;
        lunarModule.add(cabinMesh);

        // Patas de aterrizaje (Pequeños cilindros inclinados)
        for (let i = 0; i < 4; i++) {
            const legGeom = new THREE.CylinderGeometry(0.05, 0.05, 1.8);
            const leg = new THREE.Mesh(legGeom, legMaterial);
            
            // Posicionar las 4 patas en círculo alrededor de la base
            const angle = (i * Math.PI) / 2;
            leg.position.set(Math.cos(angle) * 1.1, -0.5, Math.sin(angle) * 1.1);
            leg.rotation.z = (i % 2 === 0 ? 0.3 : -0.3);
            lunarModule.add(leg);
        }

        scene.add(lunarModule);

        // 4. Animación e interactividad
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            
            // Hacer que el objeto rote lentamente para apreciarlo
            lunarModule.rotation.y += 0.005;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
